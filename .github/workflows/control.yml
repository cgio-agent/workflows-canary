name: control

# The control: the same call against the PRIVATE chrisgriffin/ops copy. From a
# public repo GitHub refuses it before scheduling a job (ops#440), which is
# the whole reason chrisgriffin/workflows exists.

on:
  push:
    branches: [main]

jobs:
  ci:
    permissions:
      contents: read
      packages: read
    uses: chrisgriffin/ops/.github/workflows/_reusable-node-ci.yml@develop
    with:
      run: npm test
