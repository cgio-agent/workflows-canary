name: build

# The canary: a PUBLIC repo calling the reusable CI gate hosted in the PUBLIC
# chrisgriffin/workflows repo, at develop, the merged state.

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ci:
    permissions:
      contents: read
      packages: read
    uses: chrisgriffin/workflows/.github/workflows/_reusable-node-ci.yml@003-versioned-releases
    with:
      run: npm test
      claude_md_budget: "2000"
